#################################
#             Backend           #
#################################
backend = "glx";
glx-copy-from-front = false;
use-damage = false;
vsync = true;

#################################
#           Animaciones         #
#################################
animations = true;
animation-stiffness = 200;
animation-dampening = 25;
animation-clamping = true;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";

#################################
#           Transparencia       #
#################################
active-opacity = 1.0;
inactive-opacity = 0.95;

opacity-rule = [
  "95:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "90:class_g = 'Rofi'",
  "100:class_g = 'Firefox'",
  "100:class_g = 'discord'",
  "100:class_g = 'Spotify'",
  "100:class_g = 'vlc'",
];

#################################
#     Blur (Desenfoque)         #
#################################
blur: {
  method = "dual_kawase";
  strength = 6;
  background = false;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "class_g = 'firefox'",
  "class_g = 'qutebrowser'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Sombras             #
#################################
shadow = true;
shadow-radius = 20;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.5;

shadow-exclude = [
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "class_g = 'Rofi'"
];

#################################
#           Esquinas            #
#################################
corner-radius = 14;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
];

#################################
#      Fading                   #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;
